name: CI + Build and Publish Docker Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Build + Test + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore ./GameServer/GameServer.csproj
          dotnet restore ./GameServer.Tests/GameServer.Tests.csproj

      - name: Build
        run: |
          dotnet build ./GameServer/GameServer.csproj -c Release --no-restore
          dotnet build ./GameServer.Tests/GameServer.Tests.csproj -c Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test ./GameServer.Tests/GameServer.Tests.csproj -c Release --no-build --verbosity normal \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            --settings ./coverlet.runsettings

      - name: Generate coverage report (HTML + Summary)
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "./TestResults/**/coverage.cobertura.xml"
          targetdir: "./coveragereport"
          reporttypes: "HtmlInline;Cobertura;MarkdownSummary"
          title: "GameServer Coverage"
          tag: "${{ github.run_number }}"

      - name: Publish coverage summary
        run: cat ./coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY

      - name: Publish API test summaries
        run: python3 ./.github/scripts/publish_test_summary.py

      - name: Upload test results + coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            ./TestResults
            ./coveragereport

  build-and-push:
    name: Build and push Docker image
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./GameServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-github-release:
    name: Create GitHub Release
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
